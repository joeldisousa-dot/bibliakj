<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bíblia King James</title>

  <style>
    /* ============================================================
       PESQUISA
       ============================================================ */

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
    }

    .search input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color: #fff;
      outline: none;
    }

    .search input::placeholder {
      color: #c4baad;
    }

    /* Botão Limpar */
    .search .secondary {
      background: rgba(255,255,255,.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: none;
      padding: 11px 15px;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s ease;
      white-space: nowrap;
    }

    .search .secondary:hover {
      background: rgba(255,255,255,.15);
    }

    .search-results {
      display: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- ============================================================
       PESQUISA
       ============================================================ -->

  <div class="search">

    <input
      type="text"
      id="searchInput"
      placeholder="Pesquisar na Bíblia..."
      autocomplete="off"
      oninput="pesquisarBiblia()"
    >

    <button
      type="button"
      class="secondary"
      id="clearSearch"
      onclick="limparPesquisa()"
    >
      Limpar
    </button>

  </div>

  <!-- Resultados da pesquisa -->
  <div
    id="searchResults"
    class="search-results">
  </div>


  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->

  <script>

    /* ============================================================
       LIMPAR PESQUISA
       ============================================================ */

    function limparPesquisa() {

      const campo =
        document.getElementById('searchInput');

      const caixa =
        document.getElementById('searchResults');

      if (campo) {
        campo.value = '';
      }

      if (caixa) {
        caixa.innerHTML = '';
        caixa.style.display = 'none';
      }

      if (campo) {
        campo.focus();
      }
    }


    /* ============================================================
       PESQUISAR BÍBLIA
       ============================================================ */

    function pesquisarBiblia() {

      const campo =
        document.getElementById('searchInput');

      const caixa =
        document.getElementById('searchResults');

      if (!campo || !caixa) {
        return;
      }

      const termo =
        campo.value.trim();

      if (!termo) {
        caixa.innerHTML = '';
        caixa.style.display = 'none';
        return;
      }

      /*
       * Coloque aqui a sua rotina atual
       * de pesquisa da Bíblia.
       *
       * Esta parte é apenas um exemplo
       * para demonstrar o funcionamento.
       */

      caixa.style.display = 'block';

      caixa.innerHTML =
        '<div style="padding:12px;">' +
        'Pesquisando por: <strong>' +
        escaparHTML(termo) +
        '</strong>' +
        '</div>';
    }


    /* ============================================================
       PROTEÇÃO DE HTML
       ============================================================ */

    function escaparHTML(texto) {

      return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }

  </script>

</body>
</html>
