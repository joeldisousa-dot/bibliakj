<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#151515">
<meta name="description" content="Bíblia King James - leitura, pesquisa e texto diário.">
<title>Bíblia King James</title>
<style>
:root{--bg:#f3f0e9;--surface:#fffdf8;--surface2:#f8f4ec;--text:#29251f;--muted:#766e63;--line:#ded7cb;--accent:#8b5e34;--accentDark:#684421;--dark:#151515;--white:#fff;--shadow:0 12px 35px rgba(35,29,20,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}button,input,select{font:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:100;background:rgba(21,21,21,.97);color:white;box-shadow:0 4px 18px rgba(0,0,0,.18)}.topbar-inner{max-width:1200px;margin:auto;min-height:70px;padding:12px 18px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:11px;min-width:240px}.brand-icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);border-radius:10px;font-size:21px}.brand strong{display:block;font-size:19px}.brand small{display:block;color:#cfc8bd;font-size:12px;margin-top:2px}
.search{flex:1;display:flex;gap:8px;min-width:0}.search input,.search select{border:1px solid #444;background:#242424;color:white;border-radius:10px;padding:12px 14px;outline:none}.search input{width:100%;min-width:100px}.search select{flex-shrink:0;max-width:190px}.search input:focus,.search select:focus{border-color:#b58a60}.search select option{background:#242424;color:white}
.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:white;transition:.2s;white-space:nowrap}.btn:hover{background:var(--accentDark)}.btn.secondary{background:#eee8dd;color:#3c352d}.btn.secondary:hover{background:#e2d9ca}
.layout{max-width:1200px;margin:auto;padding:24px 18px 50px;display:grid;grid-template-columns:255px minmax(0,1fr);gap:24px}.sidebar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;height:fit-content;position:sticky;top:94px;box-shadow:var(--shadow)}.sidebar-title{font-weight:bold;margin-bottom:12px;font-size:16px}.testament-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.tab{border:1px solid var(--line);background:var(--surface2);color:var(--text);padding:9px 5px;border-radius:8px}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}#bookList{display:grid;gap:4px;max-height:62vh;overflow:auto}.book{width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:9px 10px;color:var(--text)}.book:hover,.book.active{background:#eee6da;color:var(--accentDark);font-weight:bold}.content{min-width:0}
.daily{background:linear-gradient(135deg,#211c17,#3d2b1d);color:white;border-radius:18px;padding:25px;margin-bottom:22px;box-shadow:var(--shadow)}.daily-label{color:#d8b895;text-transform:uppercase;letter-spacing:1.4px;font-size:12px;font-weight:bold}.daily h2{margin:7px 0 13px;font-size:25px}.daily p{font-size:19px;line-height:1.75;margin:0 0 18px}.daily-actions{display:flex;gap:8px;flex-wrap:wrap}
.reader{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.reader-head{padding:22px 24px 16px;border-bottom:1px solid var(--line)}.breadcrumb{color:var(--muted);font-size:13px;margin-bottom:5px}.reader-title{margin:0;font-size:30px}.chapter-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 24px;background:var(--surface2);border-bottom:1px solid var(--line)}.chapter-picker{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:bold;text-align:center}.chapter-picker label{white-space:nowrap}.chapter-picker select{max-width:190px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer}.chapter-picker select:focus{outline:2px solid var(--accent);outline-offset:2px}.verses{padding:18px 24px 30px}.verse{position:relative;padding:8px 8px 8px 53px;border-radius:9px;line-height:1.85;font-size:19px}.verse:hover{background:#faf7f1}.verse-number{position:absolute;left:8px;top:10px;width:35px;text-align:right;color:var(--accent);font-size:14px;font-weight:bold}.verse-actions{display:inline-flex;margin-left:8px;opacity:0;transition:.2s}.verse:hover .verse-actions{opacity:1}.small-share{border:0;background:transparent;color:var(--accent);padding:2px 5px;font-size:17px}.small-share:hover{color:var(--accentDark);transform:scale(1.1)}
.search-results{margin-top:20px;display:none}.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px;cursor:pointer}.result:hover{border-color:#bda98f;background:#fffaf2}.result-ref{color:var(--accent);font-weight:bold;margin-bottom:5px}.empty,.loading,.error{padding:35px;text-align:center;color:var(--muted)}.loading{animation:pulse 1.2s infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}.error{color:#9b2c2c}.status{position:fixed;right:18px;bottom:18px;background:#202020;color:white;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(8px);transition:.25s;z-index:500;max-width:360px}.status.show{opacity:1;transform:translateY(0)}.search-highlight{display:inline;padding:1px 3px;border-radius:4px;color:#14532d!important;background:#bbf7d0;font-weight:800;-webkit-box-decoration-break:clone;box-decoration-break:clone}.result .search-highlight{box-shadow:inset 0 -1px 0 #4ade80}
@media(max-width:850px){.topbar-inner{flex-wrap:wrap}.brand{min-width:0}.search{order:3;flex-basis:100%}.layout{grid-template-columns:1fr}.sidebar{position:static}#bookList{max-height:220px;grid-template-columns:repeat(2,minmax(0,1fr))}.daily h2{font-size:22px}.reader-title{font-size:25px}.verse{padding-left:43px;font-size:18px}.verse-actions{opacity:1}}
@media(max-width:500px){.topbar-inner{padding:10px 12px}.search{flex-wrap:wrap}.search select{width:100%;max-width:none}.search input{flex:1;min-width:0}.layout{padding:15px 10px 35px}.daily{padding:19px}.reader-head{padding:18px 17px 14px}.chapter-controls{padding:10px 8px;gap:5px}.chapter-controls .btn{padding:8px 7px;font-size:12px}.chapter-picker{gap:4px;font-size:13px}.chapter-picker select{max-width:105px;padding:8px 5px;font-size:13px}.verses{padding:12px 12px 25px}.verse{padding-left:39px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><div class="brand-icon">✝</div><div><strong>Bíblia King James</strong><small>Leitura e estudo das Escrituras</small></div></div>
  <div class="search">
    <select id="searchTestament" aria-label="Escolher onde pesquisar" title="Escolher onde pesquisar">
      <option value="TODOS">Toda a Bíblia</option>
      <option value="NT">Novo Testamento (NT)</option>
      <option value="AT">Antigo Testamento (AT)</option>
    </select>
    <input id="searchInput" type="search" placeholder="Pesquisar uma palavra ou expressão...">
    <button class="btn" onclick="pesquisar()">Pesquisar</button>
    <button class="btn secondary" onclick="limparPesquisa()">Limpar</button>
  </div>
</div></header>
<main class="layout">
  <aside class="sidebar"><div class="sidebar-title">Livros da Bíblia</div>
    <div class="testament-tabs">
      <button id="tabAT" class="tab active" onclick="selecionarTestamento('AT')">Antigo</button>
      <button id="tabNT" class="tab" onclick="selecionarTestamento('NT')">Novo</button>
    </div>
    <div id="bookList"><div class="loading">Carregando livros...</div></div>
  </aside>
  <section class="content">
    <section class="daily"><div class="daily-label">✦ Palavra para hoje</div><h2 id="dailyReference">Carregando...</h2><p id="dailyText">Carregando o texto bíblico para hoje...</p>
      <div class="daily-actions"><button class="btn" onclick="compartilharDiario()">↗ Compartilhar</button><button class="btn" onclick="abrirDiario()">Ler versículo</button></div>
    </section>
    <section id="searchResults" class="search-results"></section>
    <section class="reader"><div class="reader-head"><div class="breadcrumb" id="readerBreadcrumb">Bíblia King James</div><h1 class="reader-title" id="readerTitle">Selecione um livro</h1></div>
      <div class="chapter-controls">
        <button class="btn secondary" onclick="capituloAnterior()">← Anterior</button>
        <div class="chapter-picker">
          <label for="chapterSelect">Capítulo</label>
          <select id="chapterSelect" aria-label="Selecionar capítulo" onchange="selecionarCapitulo(this.value)">
            <option value="1">Capítulo 1</option>
          </select>
        </div>
        <button class="btn secondary" onclick="proximoCapitulo()">Próximo →</button>
      </div>
      <div id="verses" class="verses"><div class="empty">Escolha um livro e um capítulo para começar a leitura.</div></div>
    </section>
  </section>
</main>
<div id="status" class="status" role="status" aria-live="polite"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyACS3Hi-BjcYFvCA1j8FzjMcEdc26-j2jc557fhdCmvHNz3qdhdRvXhTxVn9yAnxwm1w/exec';
let livros=[],testamentoAtual='AT',livroAtual=null,capituloAtual=1,ultimoDiario=null,termoPesquisado='';

document.addEventListener('DOMContentLoaded',async()=>{
  const campo=document.getElementById('searchInput');
  campo.addEventListener('keydown',evento=>{if(evento.key==='Enter')pesquisar();});
  await Promise.allSettled([carregarLivros(),carregarDiario()]);
});

function api(parametros){return new Promise((resolve,reject)=>{
  if(!API_URL){reject(new Error('URL da API do Google Apps Script não configurada.'));return;}
  const callback='kjsApi_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const params=new URLSearchParams(parametros||{});params.set('callback',callback);
  const script=document.createElement('script');let finalizado=false;
  const timeout=setTimeout(()=>{finalizar();reject(new Error('Tempo esgotado ao comunicar com o Google Apps Script.'));},15000);
  function finalizar(){if(finalizado)return;finalizado=true;clearTimeout(timeout);script.remove();try{delete window[callback];}catch(e){window[callback]=undefined;}}
  window[callback]=dados=>{if(finalizado)return;finalizar();dados=dados||{};if(dados.sucesso===false||dados.ok===false){reject(new Error(dados.erro||'Erro retornado pela API.'));return;}resolve(dados);};
  script.async=true;script.src=API_URL+'?'+params.toString();script.onerror=()=>{if(finalizado)return;finalizar();reject(new Error('Não foi possível comunicar com o Google Apps Script.'));};document.body.appendChild(script);
});}

async function carregarLivros(){const container=document.getElementById('bookList');container.innerHTML='<div class="loading">Carregando livros...</div>';
  try{const dados=await api({action:'livros'});livros=Array.isArray(dados.livros)?dados.livros.map(l=>{const codigo=l.livro||l.codigo||'';return Object.assign({},l,{livro:String(codigo),codigo:String(codigo),nome:String(l.nome||l.nomeLivro||codigo),qual:normalizar(l.qual)}); }):[];
    if(!livros.length)throw new Error('Nenhum livro foi encontrado na aba "Livros".');renderizarLivros();const primeiro=livros.find(l=>l.qual==='AT')||livros[0];if(primeiro)await selecionarLivro(primeiro);
  }catch(erro){container.innerHTML=`<div class="error">${esc(erro.message)}</div>`;mostrarStatus(erro.message);}}

function selecionarTestamento(qual){testamentoAtual=String(qual||'AT').toUpperCase();document.getElementById('tabAT').classList.toggle('active',testamentoAtual==='AT');document.getElementById('tabNT').classList.toggle('active',testamentoAtual==='NT');renderizarLivros();}
function renderizarLivros(){const container=document.getElementById('bookList');const lista=livros.filter(l=>l.qual===normalizar(testamentoAtual));if(!lista.length){container.innerHTML='<div class="empty">Nenhum livro encontrado.</div>';return;}
  container.innerHTML=lista.map(l=>`<button class="book ${livroAtual&&String(l.livro)===String(livroAtual.livro)?'active':''}" data-livro="${esc(l.livro)}">${esc(l.nome)}</button>`).join('');
  container.querySelectorAll('.book').forEach(b=>b.addEventListener('click',()=>{const l=livros.find(x=>String(x.livro)===String(b.dataset.livro));if(l)selecionarLivro(l);}));}
async function selecionarLivro(livro){if(!livro)return;livroAtual=livro;capituloAtual=1;selecionarTestamento(livro.qual||'AT');renderizarLivros();await carregarCapitulo();}

// Quantidade de capítulos de cada livro da Bíblia King James (66 livros).
const TOTAL_CAPITULOS_BIBLIA = {
  'genesis':50,'exodo':40,'levitico':27,'numeros':36,'deuteronomio':34,
  'josue':24,'juizes':21,'rute':4,'1samuel':31,'2samuel':24,
  '1reis':22,'2reis':25,'1cronicas':29,'2cronicas':36,'esdras':10,
  'neemias':13,'ester':10,'jo':42,'salmos':150,'proverbios':31,
  'eclesiastes':12,'canticos':8,'cantico dos canticos':8,'isaias':66,
  'jeremias':52,'lamentacoes':5,'ezequiel':48,'daniel':12,'oseias':14,
  'joel':3,'amos':9,'obadias':1,'jonas':4,'miqueias':7,'naum':3,
  'habacuque':3,'sofonias':3,'ageu':2,'zacarias':14,'malaquias':4,
  'mateus':28,'marcos':16,'lucas':24,'joao':21,'atos':28,
  'romanos':16,'1corintios':16,'2corintios':13,'galatas':6,'efesios':6,
  'filipenses':4,'colossenses':4,'1tessalonicenses':5,'2tessalonicenses':3,
  '1timoteo':6,'2timoteo':4,'tito':3,'filemom':1,'hebreus':13,
  'tiago':5,'1pedro':5,'2pedro':3,'1joao':5,'2joao':1,'3joao':1,
  'judas':1,'apocalipse':22
};

function normalizarNomeLivroParaCapitulos(nome){
  return String(nome||'').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}

function descobrirTotalCapitulos(livro){
  const nome=normalizarNomeLivroParaCapitulos(livro&&livro.nome);
  const codigo=normalizarNomeLivroParaCapitulos(livro&&livro.livro);
  const aliases={
    'genesis':'genesis','exodo':'exodo','levitico':'levitico','numeros':'numeros',
    'deuteronomio':'deuteronomio','josue':'josue','juizes':'juizes','rute':'rute',
    '1samuel':'1samuel','2samuel':'2samuel','1reis':'1reis','2reis':'2reis',
    '1cronicas':'1cronicas','2cronicas':'2cronicas','esdras':'esdras','neemias':'neemias',
    'ester':'ester','jo':'jo','job':'jo','salmos':'salmos','salmo':'salmos',
    'proverbios':'proverbios','eclesiastes':'eclesiastes','canticos':'canticos',
    'canticodoscanticos':'canticos','isaias':'isaias','jeremias':'jeremias',
    'lamentacoes':'lamentacoes','ezequiel':'ezequiel','daniel':'daniel','oseias':'oseias',
    'joel':'joel','amos':'amos','obadias':'obadias','jonas':'jonas','miqueias':'miqueias',
    'naum':'naum','habacuque':'habacuque','sofonias':'sofonias','ageu':'ageu',
    'zacarias':'zacarias','malaquias':'malaquias','mateus':'mateus','marcos':'marcos',
    'lucas':'lucas','joao':'joao','atos':'atos','romanos':'romanos',
    '1corintios':'1corintios','2corintios':'2corintios','galatas':'galatas','efesios':'efesios',
    'filipenses':'filipenses','colossenses':'colossenses','1tessalonicenses':'1tessalonicenses',
    '2tessalonicenses':'2tessalonicenses','1timoteo':'1timoteo','2timoteo':'2timoteo',
    'tito':'tito','filemom':'filemom','filemon':'filemom','hebreus':'hebreus','tiago':'tiago',
    '1pedro':'1pedro','2pedro':'2pedro','1joao':'1joao','2joao':'2joao','3joao':'3joao',
    'judas':'judas','apocalipse':'apocalipse','revelacao':'apocalipse'
  };
  for(const chave of [nome,codigo]){
    const chaveCanonica=aliases[chave]||chave;
    if(TOTAL_CAPITULOS_BIBLIA[chaveCanonica])return TOTAL_CAPITULOS_BIBLIA[chaveCanonica];
  }
  return 0;
}

function preencherSeletorCapitulos(capitulos, atual){
  const seletor=document.getElementById('chapterSelect');
  if(!seletor)return;
  capitulos=[...new Set(capitulos.map(Number).filter(n=>Number.isInteger(n)&&n>0))].sort((a,b)=>a-b);
  if(!capitulos.length)capitulos=[atual];
  seletor.innerHTML=capitulos.map(n=>`<option value="${n}">Capítulo ${n}</option>`).join('');
  if(!capitulos.includes(atual)){
    seletor.insertAdjacentHTML('beforeend',`<option value="${atual}">Capítulo ${atual}</option>`);
  }
  seletor.value=String(atual);
  seletor.disabled=false;
}

async function atualizarSeletorCapitulos(capitulo){
  const seletor=document.getElementById('chapterSelect');
  if(!seletor||!livroAtual)return;
  const atual=Number(capitulo)||1;
  seletor.innerHTML='<option value="">Carregando capítulos...</option>';
  seletor.disabled=true;

  // Primeiro tenta obter os capítulos reais da planilha, caso a API ofereça essa ação.
  try{
    const dados=await api({action:'capitulos',livro:livroAtual.livro});
    let capitulos=Array.isArray(dados.capitulos)?dados.capitulos:[];
    capitulos=capitulos.map(Number).filter(n=>Number.isInteger(n)&&n>0);
    if(!capitulos.length&&Number(dados.totalCapitulos)>0){
      capitulos=Array.from({length:Number(dados.totalCapitulos)},(_,i)=>i+1);
    }
    if(capitulos.length){preencherSeletorCapitulos(capitulos,atual);return;}
  }catch(e){/* Usa a contagem padrão abaixo se a ação não existir na API. */}

  const total=descobrirTotalCapitulos(livroAtual);
  const capitulos=total?Array.from({length:total},(_,i)=>i+1):[atual];
  preencherSeletorCapitulos(capitulos,atual);
}

function selecionarCapitulo(valor){
  const numero=Number(valor);
  if(!livroAtual||!Number.isInteger(numero)||numero<1)return;
  capituloAtual=numero;
  carregarCapitulo();
}

async function carregarCapitulo(){if(!livroAtual)return;const container=document.getElementById('verses');container.innerHTML='<div class="loading">Carregando capítulo...</div>';
  try{const dados=await api({action:'capitulo',livro:livroAtual.livro,cap:capituloAtual});renderizarCapitulo(dados);}catch(erro){container.innerHTML=`<div class="error">${esc(erro.message)}</div>`;}}

function renderizarCapitulo(dados){if(!dados||!dados.livro){document.getElementById('verses').innerHTML='<div class="empty">Este capítulo não foi encontrado.</div>';return;}
  capituloAtual=Number(dados.capitulo)||capituloAtual;
  document.getElementById('readerBreadcrumb').textContent=`${normalizar(dados.livro.qual)==='NT'?'Novo Testamento':'Antigo Testamento'} • ${dados.livro.nome}`;
  document.getElementById('readerTitle').textContent=`${dados.livro.nome} ${dados.capitulo}`;
  atualizarSeletorCapitulos(capituloAtual);
  const versiculos=Array.isArray(dados.versiculos)?dados.versiculos:[];if(!versiculos.length){document.getElementById('verses').innerHTML='<div class="empty">Este capítulo não foi encontrado.</div>';return;}
  document.getElementById('verses').innerHTML=versiculos.map(v=>{const ref=`${dados.livro.nome} ${dados.capitulo}:${v.versiculo}`;return `<article class="verse" id="v-${esc(v.versiculo)}"><span class="verse-number">${esc(v.versiculo)}</span><span class="verse-text">${destacarTexto(v.texto,termoPesquisado)}</span><span class="verse-actions"><button class="small-share" title="Compartilhar versículo" data-ref="${esc(ref)}" data-texto="${esc(v.texto)}">↗</button></span></article>`;}).join('');
  document.querySelectorAll('.small-share').forEach(b=>b.addEventListener('click',()=>compartilharTexto(b.dataset.ref,b.dataset.texto)));window.scrollTo({top:0,behavior:'smooth'});}

function capituloAnterior(){if(!livroAtual||capituloAtual<=1){mostrarStatus('Você já está no primeiro capítulo.');return;}capituloAtual--;carregarCapitulo();}
function proximoCapitulo(){if(!livroAtual)return;capituloAtual++;carregarCapitulo();}

async function carregarDiario(){try{ultimoDiario=await api({action:'diario'});document.getElementById('dailyReference').textContent=ultimoDiario.referencia||'Texto do dia';document.getElementById('dailyText').textContent=ultimoDiario.texto||'';}catch(erro){document.getElementById('dailyReference').textContent='Texto do dia';document.getElementById('dailyText').textContent=erro.message;}}
async function abrirDiario(){if(!ultimoDiario)return;const codigo=ultimoDiario.livro&&ultimoDiario.livro.livro;const livro=livros.find(l=>String(l.livro)===String(codigo));if(!livro){mostrarStatus('Livro do texto diário não encontrado.');return;}selecionarTestamento(livro.qual||'AT');livroAtual=livro;capituloAtual=Number(ultimoDiario.capitulo);renderizarLivros();await carregarCapitulo();setTimeout(()=>{const el=document.getElementById(`v-${ultimoDiario.versiculo}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},300);}
async function compartilharDiario(){if(ultimoDiario)await compartilharTexto(ultimoDiario.referencia,ultimoDiario.texto);}
async function compartilharTexto(referencia,texto){const mensagem=`${referencia}\n\n"${texto}"\n\nBíblia King James`;if(navigator.share){try{await navigator.share({title:referencia,text:mensagem,url:location.href});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)await navigator.clipboard.writeText(mensagem);else{const area=document.createElement('textarea');area.value=mensagem;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();}mostrarStatus('Texto copiado. Agora você pode compartilhar.');}catch(e){mostrarStatus('Não foi possível copiar o texto.');}}

function regexEscapada(texto){return String(texto).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function criarRegexDestaque(consulta){const termos=String(consulta||'').trim().split(/\s+/).filter(Boolean);if(!termos.length)return null;termos.sort((a,b)=>b.length-a.length);const alternativas=termos.map(termo=>Array.from(termo.normalize('NFD').replace(/[\u0300-\u036f]/g,'')).map(c=>{const grupos={a:'[aáàâãäÁÀÂÃÄ]',e:'[eéèêëÉÈÊË]',i:'[iíìîïÍÌÎÏ]',o:'[oóòôõöÓÒÔÕÖ]',u:'[uúùûüÚÙÛÜ]',c:'[cçCÇ]',n:'[nñNÑ]'};return grupos[c.toLowerCase()]||regexEscapada(c);}).join(''));try{return new RegExp('('+alternativas.join('|')+')','giu');}catch(e){return null;}}
function destacarTexto(texto,consulta){const original=String(texto??'');const regex=criarRegexDestaque(consulta);if(!regex)return esc(original);let saida='',pos=0,match;while((match=regex.exec(original))!==null){if(!match[0]){regex.lastIndex++;continue;}saida+=esc(original.slice(pos,match.index));saida+='<mark class="search-highlight">'+esc(match[0])+'</mark>';pos=match.index+match[0].length;}return saida+esc(original.slice(pos));}

async function pesquisar(){const campo=document.getElementById('searchInput');const filtro=document.getElementById('searchTestament');const caixa=document.getElementById('searchResults');const consulta=campo.value.trim();const qual=filtro.value||'TODOS';if(consulta.length<2){mostrarStatus('Digite pelo menos 2 caracteres.');campo.focus();return;}
  termoPesquisado=consulta;caixa.style.display='block';caixa.innerHTML='<div class="loading">Pesquisando...</div>';
  try{const dados=await api({action:'buscar',q:consulta,qual:qual,testamento:qual,limite:200});let resultados=Array.isArray(dados.resultados)?dados.resultados:[];
    // Filtro complementar no navegador. O Apps Script também deve aplicar qual/testamento
    // antes do limite de resultados para que a busca seja completa em cada testamento.
    if(qual!=='TODOS'){const codigos=new Set(livros.filter(l=>l.qual===qual).map(l=>String(l.livro)));resultados=resultados.filter(r=>codigos.has(String(r.livro))||normalizar(r.qual)===qual||normalizar(r.testamento)===qual);}
    if(!resultados.length){const nome={TODOS:'em toda a Bíblia',NT:'no Novo Testamento',AT:'no Antigo Testamento'}[qual];caixa.innerHTML=`<div class="empty">Nenhum versículo encontrado para <strong>${esc(consulta)}</strong> ${nome}.<br><br>Experimente outra palavra ou selecione outro testamento.</div>`;return;}
    const nome={TODOS:'Toda a Bíblia',NT:'Novo Testamento',AT:'Antigo Testamento'}[qual];caixa.innerHTML=`<div style="margin-bottom:14px;color:var(--muted)"><strong>${resultados.length}</strong> resultado(s) para <strong>${esc(dados.consulta||consulta)}</strong><div style="margin-top:6px">Pesquisa em: <strong>${nome}</strong></div></div>`+resultados.map(r=>`<div class="result" role="button" tabindex="0" data-livro="${esc(r.livro)}" data-capitulo="${esc(r.capitulo)}" data-versiculo="${esc(r.versiculo)}"><div class="result-ref">${esc(r.nome)} ${esc(r.capitulo)}:${esc(r.versiculo)}</div><div class="result-text">${destacarTexto(r.texto,termoPesquisado)}</div></div>`).join('');
    caixa.querySelectorAll('.result').forEach(el=>{const abrir=()=>abrirResultado({livro:el.dataset.livro,capitulo:Number(el.dataset.capitulo),versiculo:Number(el.dataset.versiculo)});el.addEventListener('click',abrir);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();abrir();}});});caixa.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(erro){caixa.innerHTML=`<div class="error">${esc(erro.message)}</div>`;}}
function limparPesquisa(){document.getElementById('searchInput').value='';document.getElementById('searchResults').innerHTML='';document.getElementById('searchResults').style.display='none';termoPesquisado='';document.getElementById('searchInput').focus();if(livroAtual)carregarCapitulo();}
async function abrirResultado(resultado){const livro=livros.find(l=>String(l.livro)===String(resultado.livro));if(!livro){mostrarStatus('Livro não encontrado.');return;}selecionarTestamento(livro.qual||'AT');livroAtual=livro;capituloAtual=Number(resultado.capitulo);renderizarLivros();await carregarCapitulo();setTimeout(()=>{const el=document.getElementById(`v-${resultado.versiculo}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},300);}
function mostrarStatus(mensagem){const el=document.getElementById('status');el.textContent=mensagem;el.classList.add('show');clearTimeout(window.statusTimer);window.statusTimer=setTimeout(()=>el.classList.remove('show'),3500);}
function normalizar(valor){return String(valor||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();}
function esc(valor){return String(valor??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
</script>
