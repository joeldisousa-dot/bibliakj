<style>

/* ============================================================
   BÍBLIA KING JAMES — VISUAL MODERNO
   ============================================================ */

:root {

  --bg: #f4f6f8;
  --bg-soft: #eef1f4;

  --surface: rgba(255,255,255,.94);
  --surface-solid: #ffffff;
  --surface-soft: #f8fafb;

  --text: #20242a;
  --text-soft: #59616b;
  --muted: #7a838e;

  --line: #e2e6ea;
  --line-soft: #edf0f3;

  --primary: #8a5a2b;
  --primary-dark: #633d1b;
  --primary-light: #f3e8d9;

  --gold: #c99a55;
  --gold-light: #f8ecd9;

  --dark: #11161c;
  --dark-soft: #1b222a;
  --dark-light: #26303a;

  --success: #2e7d5b;
  --danger: #b43b3b;

  --white: #ffffff;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;

  --shadow-sm:
    0 3px 12px rgba(20,30,40,.06);

  --shadow:
    0 10px 35px rgba(20,30,40,.09);

  --shadow-lg:
    0 18px 55px rgba(20,30,40,.13);

  --transition:
    all .22s ease;

}


/* ============================================================
   RESET
   ============================================================ */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  margin: 0;

  min-height: 100vh;

  color: var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:

    radial-gradient(
      circle at 10% 0%,
      rgba(201,154,85,.10),
      transparent 28%
    ),

    radial-gradient(
      circle at 90% 10%,
      rgba(138,90,43,.07),
      transparent 25%
    ),

    linear-gradient(
      180deg,
      #f8f9fa 0%,
      #f1f3f5 100%
    );

}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

::selection {

  background: rgba(138,90,43,.18);

  color: var(--text);

}


/* ============================================================
   TOPO
   ============================================================ */

.topbar {

  position: sticky;

  top: 0;

  z-index: 1000;

  color: white;

  background:

    linear-gradient(
      135deg,
      #0e1318 0%,
      #151c23 55%,
      #1c242c 100%
    );

  border-bottom:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.18);

  backdrop-filter:
    blur(16px);

  -webkit-backdrop-filter:
    blur(16px);

}


.topbar-inner {

  width: 100%;

  max-width: 1280px;

  min-height: 74px;

  margin: auto;

  padding:
    12px
    20px;

  display: flex;

  align-items: center;

  gap: 22px;

}


/* ============================================================
   MARCA
   ============================================================ */

.brand {

  display: flex;

  align-items: center;

  gap: 12px;

  min-width: 270px;

}


.brand-icon {

  width: 46px;

  height: 46px;

  display: grid;

  place-items: center;

  flex-shrink: 0;

  border-radius: 14px;

  border:
    1px solid
    rgba(255,255,255,.16);

  background:

    linear-gradient(
      145deg,
      #b27c42,
      #70441f
    );

  color: white;

  font-size: 21px;

  box-shadow:
    0 7px 20px
    rgba(0,0,0,.25);

}


.brand strong {

  display: block;

  font-size: 18px;

  font-weight: 750;

  letter-spacing: -.3px;

}


.brand small {

  display: block;

  margin-top: 3px;

  color: #aeb7c0;

  font-size: 11px;

  letter-spacing: .2px;

}


/* ============================================================
   PESQUISA
   ============================================================ */

.search {

  flex: 1;

  min-width: 0;

  display: flex;

  gap: 9px;

}


.search-input-wrapper {

  position: relative;

  flex: 1;

  min-width: 0;

}


.search input {

  width: 100%;

  height: 46px;

  padding:
    0 46px
    0 17px;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius: 13px;

  outline: none;

  color: white;

  background:
    rgba(255,255,255,.075);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.03);

  transition: var(--transition);

}


.search input::placeholder {
  color: #89929c;
}


.search input:hover {

  border-color:
    rgba(255,255,255,.23);

}


.search input:focus {

  border-color:
    rgba(201,154,85,.8);

  background:
    rgba(255,255,255,.105);

  box-shadow:

    0 0 0 4px
    rgba(201,154,85,.10),

    inset 0 1px 0
    rgba(255,255,255,.04);

}


.clear-search {

  position: absolute;

  right: 9px;

  top: 50%;

  transform:
    translateY(-50%);

  width: 30px;

  height: 30px;

  display: none;

  place-items: center;

  border: 0;

  border-radius: 50%;

  background:
    transparent;

  color: #9ca4ad;

  font-size: 20px;

  transition: var(--transition);

}


.clear-search:hover {

  color: white;

  background:
    rgba(255,255,255,.10);

}


/* ============================================================
   BOTÕES
   ============================================================ */

.btn {

  min-height: 42px;

  border: 0;

  border-radius: 11px;

  padding:
    10px
    15px;

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 7px;

  white-space: nowrap;

  color: white;

  background:

    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );

  box-shadow:
    0 5px 15px
    rgba(99,61,27,.16);

  transition: var(--transition);

}


.btn:hover {

  transform:
    translateY(-2px);

  box-shadow:
    0 9px 20px
    rgba(99,61,27,.22);

}


.btn:active {

  transform:
    translateY(0);

}


.btn.secondary {

  color: #4d535a;

  background:
    #eef1f3;

  border:
    1px solid
    #e1e5e8;

  box-shadow: none;

}


.btn.secondary:hover {

  color: var(--primary-dark);

  background:
    #e7e9eb;

  border-color:
    #d8dde1;

}


.btn.outline {

  color: #dce1e5;

  background:
    transparent;

  border:
    1px solid
    rgba(255,255,255,.18);

  box-shadow: none;

}


/* ============================================================
   LAYOUT
   ============================================================ */

.layout {

  width: 100%;

  max-width: 1280px;

  margin: auto;

  padding:
    26px
    20px
    60px;

  display: grid;

  grid-template-columns:
    270px
    minmax(0,1fr);

  gap: 26px;

}


/* ============================================================
   SIDEBAR
   ============================================================ */

.sidebar {

  position: sticky;

  top: 96px;

  height: fit-content;

  padding: 18px;

  border:
    1px solid
    rgba(255,255,255,.8);

  border-radius:
    var(--radius-lg);

  background:
    rgba(255,255,255,.88);

  box-shadow:
    var(--shadow);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

}


.sidebar-title {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-bottom: 4px;

  font-size: 16px;

  font-weight: 750;

  letter-spacing: -.2px;

}


.sidebar-title::before {

  content: "▦";

  color: var(--primary);

  font-size: 17px;

}


.sidebar-subtitle {

  margin-bottom: 15px;

  color: var(--muted);

  font-size: 12px;

  line-height: 1.5;

}


/* ============================================================
   ABAS
   ============================================================ */

.testament-tabs {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  padding: 4px;

  margin-bottom: 15px;

  border-radius: 12px;

  background:
    #f0f2f4;

}


.tab {

  border: 0;

  border-radius: 9px;

  padding:
    9px 7px;

  color: #69717a;

  background:
    transparent;

  font-size: 13px;

  font-weight: 650;

  transition: var(--transition);

}


.tab:hover {

  color: var(--primary-dark);

}


.tab.active {

  color: white;

  background:

    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );

  box-shadow:
    0 4px 12px
    rgba(99,61,27,.18);

}


/* ============================================================
   LISTA DE LIVROS
   ============================================================ */

#bookList {

  display: grid;

  gap: 3px;

  max-height: 64vh;

  overflow-y: auto;

  padding-right: 4px;

}


#bookList::-webkit-scrollbar {

  width: 5px;

}


#bookList::-webkit-scrollbar-track {

  background:
    transparent;

}


#bookList::-webkit-scrollbar-thumb {

  background:
    #d6dbe0;

  border-radius: 20px;

}


.book {

  position: relative;

  width: 100%;

  padding:
    9px 11px 9px 15px;

  border: 0;

  border-radius: 10px;

  text-align: left;

  color: #4b535c;

  background:
    transparent;

  font-size: 13px;

  transition: var(--transition);

}


.book:hover {

  color: var(--primary-dark);

  background:
    #f6f1e9;

  transform:
    translateX(2px);

}


.book.active {

  color: var(--primary-dark);

  background:

    linear-gradient(
      90deg,
      #f1e5d5,
      #faf7f1
    );

  font-weight: 750;

}


.book.active::before {

  content: "";

  position: absolute;

  left: 4px;

  top: 7px;

  bottom: 7px;

  width: 3px;

  border-radius: 10px;

  background:
    linear-gradient(
      180deg,
      var(--gold),
      var(--primary)
    );

}


/* ============================================================
   CONTEÚDO
   ============================================================ */

.content {

  min-width: 0;

}


/* ============================================================
   PALAVRA PARA HOJE
   ============================================================ */

.daily {

  position: relative;

  overflow: hidden;

  margin-bottom: 24px;

  padding: 30px;

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius:
    var(--radius-lg);

  color: white;

  background:

    radial-gradient(
      circle at 85% 15%,
      rgba(201,154,85,.20),
      transparent 28%
    ),

    linear-gradient(
      135deg,
      #10161c,
      #1b242d 55%,
      #252d35
    );

  box-shadow:
    var(--shadow-lg);

}


.daily::before {

  content: "✦";

  position: absolute;

  right: 34px;

  top: 14px;

  color:
    rgba(201,154,85,.17);

  font-size: 130px;

  line-height: 1;

  pointer-events: none;

}


.daily::after {

  content: "";

  position: absolute;

  width: 180px;

  height: 180px;

  right: -80px;

  bottom: -100px;

  border-radius: 50%;

  background:
    rgba(201,154,85,.08);

  pointer-events: none;

}


.daily-label {

  position: relative;

  display: inline-flex;

  align-items: center;

  gap: 7px;

  color:
    #dcb77f;

  font-size: 11px;

  font-weight: 800;

  letter-spacing: 1.5px;

  text-transform: uppercase;

}


.daily-label::before {

  content: "";

  width: 7px;

  height: 7px;

  border-radius: 50%;

  background:
    var(--gold);

  box-shadow:
    0 0 0 5px
    rgba(201,154,85,.10);

}


.daily h2 {

  position: relative;

  margin:
    10px 0 13px;

  color: white;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 29px;

  line-height: 1.25;

  letter-spacing: -.4px;

}


.daily p {

  position: relative;

  max-width: 900px;

  margin:
    0 0 22px;

  color: #e6eaed;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 20px;

  line-height: 1.75;

}


.daily-actions {

  position: relative;

  display: flex;

  gap: 9px;

  flex-wrap: wrap;

}


/* ============================================================
   RESULTADOS
   ============================================================ */

.search-results {

  display: none;

  margin:
    0 0 24px;

}


.search-results-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  margin-bottom: 12px;

  padding:
    0 3px;

  color: var(--muted);

  font-size: 13px;

}


.search-results-header strong {

  color: var(--text);

}


.result {

  position: relative;

  margin-bottom: 9px;

  padding:
    16px 17px;

  border:
    1px solid
    var(--line);

  border-radius:
    var(--radius-md);

  background:
    rgba(255,255,255,.92);

  box-shadow:
    var(--shadow-sm);

  cursor: pointer;

  transition: var(--transition);

}


.result:hover {

  border-color:
    #d6c1a5;

  background:
    #fffdf9;

  transform:
    translateY(-2px);

  box-shadow:
    var(--shadow);

}


.result-ref {

  margin-bottom: 6px;

  color: var(--primary);

  font-size: 13px;

  font-weight: 800;

}


/* ============================================================
   LEITOR
   ============================================================ */

.reader {

  overflow: hidden;

  border:
    1px solid
    var(--line);

  border-radius:
    var(--radius-lg);

  background:
    rgba(255,255,255,.96);

  box-shadow:
    var(--shadow);

}


/* ============================================================
   CABEÇALHO DO LEITOR
   ============================================================ */

.reader-head {

  position: relative;

  padding:
    24px
    26px
    21px;

  border-bottom:
    1px solid
    var(--line-soft);

  background:

    linear-gradient(
      180deg,
      #ffffff,
      #fbfcfd
    );

}


.reader-head::after {

  content: "";

  display: block;

  width: 55px;

  height: 3px;

  margin-top: 14px;

  border-radius: 10px;

  background:

    linear-gradient(
      90deg,
      var(--gold),
      var(--primary)
    );

}


.breadcrumb {

  margin-bottom: 7px;

  color: var(--muted);

  font-size: 12px;

  font-weight: 600;

  letter-spacing: .2px;

}


.reader-title {

  margin: 0;

  color: #20252b;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 32px;

  line-height: 1.2;

  letter-spacing: -.5px;

}


/* ============================================================
   CONTROLES DE CAPÍTULO
   ============================================================ */

.chapter-controls {

  display: grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items: center;

  gap: 12px;

  padding:
    12px
    18px;

  border-bottom:
    1px solid
    var(--line);

  background:
    #f7f8f9;

}


.chapter-controls .center {

  min-width: 190px;

  text-align: center;

  color: var(--primary-dark);

  font-size: 13px;

  font-weight: 750;

}


.chapter-controls .btn:first-child {

  justify-self: start;

}


.chapter-controls .btn:last-child {

  justify-self: end;

}


/* ============================================================
   VERSÍCULOS
   ============================================================ */

.verses {

  padding:
    21px
    27px
    35px;

}


.verse {

  position: relative;

  padding:
    12px
    12px
    12px
    58px;

  margin-bottom: 3px;

  border-radius: 12px;

  color: #30353a;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 19px;

  line-height: 1.9;

  transition:
    background .2s ease,
    transform .2s ease;

}


.verse:hover {

  background:
    #faf7f1;

}


.verse-number {

  position: absolute;

  left: 10px;

  top: 14px;

  width: 32px;

  height: 32px;

  display: grid;

  place-items: center;

  border-radius: 50%;

  color: var(--primary);

  background:
    #f3e9db;

  font-family:
    Inter,
    ui-sans-serif,
    sans-serif;

  font-size: 11px;

  font-weight: 800;

}


.verse-actions {

  display: inline-flex;

  margin-left: 7px;

  opacity: 0;

  transform:
    translateY(2px);

  transition:
    var(--transition);

}


.verse:hover .verse-actions {

  opacity: 1;

  transform:
    translateY(0);

}


.small-share {

  width: 30px;

  height: 30px;

  display: grid;

  place-items: center;

  padding: 0;

  border:
    1px solid
    #e3d6c5;

  border-radius: 50%;

  color: var(--primary);

  background:
    #fffaf3;

  font-size: 15px;

  transition: var(--transition);

}


.small-share:hover {

  color: white;

  background:
    var(--primary);

  border-color:
    var(--primary);

  transform:
    scale(1.08);

}


/* ============================================================
   ESTADOS
   ============================================================ */

.empty,
.loading,
.error {

  padding:
    42px 20px;

  text-align: center;

  color: var(--muted);

  font-size: 14px;

}


.empty::before {

  content: "✦";

  display: block;

  margin-bottom: 8px;

  color: #c8a875;

  font-size: 22px;

}


.loading {

  animation:
    pulse 1.4s ease-in-out infinite;

}


.error {

  color:
    var(--danger);

}


@keyframes pulse {

  0% {
    opacity: .45;
  }

  50% {
    opacity: 1;
  }

  100% {
    opacity: .45;
  }

}


/* ============================================================
   STATUS
   ============================================================ */

.status {

  position: fixed;

  right: 20px;

  bottom: 20px;

  z-index: 5000;

  max-width: 380px;

  padding:
    13px 17px;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius: 13px;

  color: white;

  background:
    rgba(17,22,28,.94);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.22);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  opacity: 0;

  pointer-events: none;

  transform:
    translateY(12px)
    scale(.98);

  transition:
    .25s ease;

}


.status.show {

  opacity: 1;

  transform:
    translateY(0)
    scale(1);

}


/* ============================================================
   RESPONSIVIDADE
   ============================================================ */

@media (max-width: 950px) {

  .topbar-inner {

    flex-wrap: wrap;

  }


  .brand {

    min-width: 0;

    flex: 1;

  }


  .search {

    order: 3;

    flex-basis: 100%;

  }


  .layout {

    grid-template-columns: 235px minmax(0,1fr);

  }

}


@media (max-width: 800px) {

  .layout {

    grid-template-columns: 1fr;

    padding:
      20px
      15px
      45px;

  }


  .sidebar {

    position: static;

  }


  #bookList {

    max-height: 250px;

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

  }


  .daily h2 {

    font-size: 25px;

  }


  .reader-title {

    font-size: 28px;

  }

}


@media (max-width: 560px) {

  .topbar-inner {

    padding:
      10px
      12px;

    gap: 11px;

  }


  .brand {

    width: 100%;

    flex: none;

  }


  .brand-icon {

    width: 41px;

    height: 41px;

    border-radius: 12px;

  }


  .brand strong {

    font-size: 17px;

  }


  .brand small {

    font-size: 10px;

  }


  .search {

    width: 100%;

  }


  .search input {

    height: 44px;

  }


  .search .btn {

    min-height: 44px;

    padding:
      9px
      12px;

    font-size: 13px;

  }


  .layout {

    padding:
      13px
      10px
      35px;

  }


  .sidebar {

    padding: 14px;

    border-radius: 17px;

  }


  #bookList {

    max-height: 220px;

  }


  .daily {

    padding:
      22px
      19px;

    border-radius: 18px;

  }


  .daily::before {

    right: 5px;

    font-size: 100px;

  }


  .daily h2 {

    font-size: 22px;

  }


  .daily p {

    font-size: 17px;

    line-height: 1.65;

  }


  .daily-actions {

    display: grid;

    grid-template-columns:
      1fr 1fr;

  }


  .daily-actions .btn {

    width: 100%;

  }


  .reader {

    border-radius: 17px;

  }


  .reader-head {

    padding:
      19px
      17px
      16px;

  }


  .reader-title {

    font-size: 25px;

  }


  .chapter-controls {

    grid-template-columns:
      1fr auto 1fr;

    gap: 5px;

    padding:
      9px
      10px;

  }


  .chapter-controls .center {

    min-width: 0;

    font-size: 11px;

  }


  .chapter-controls .btn {

    min-height: 37px;

    padding:
      7px
      8px;

    font-size: 12px;

  }


  .verses {

    padding:
      12px
      10px
      25px;

  }


  .verse {

    padding:
      10px
      7px
      10px
      47px;

    font-size: 18px;

    line-height: 1.8;

  }


  .verse-number {

    left: 5px;

    top: 12px;

    width: 29px;

    height: 29px;

    font-size: 10px;

  }


  .verse-actions {

    opacity: 1;

  }


  .search-results-header {

    align-items: flex-start;

  }


  .result {

    padding:
      14px;

  }


  .status {

    left: 12px;

    right: 12px;

    bottom: 12px;

    max-width: none;

  }

}


/* ============================================================
   ACESSIBILIDADE
   ============================================================ */

button:focus-visible,
input:focus-visible {
